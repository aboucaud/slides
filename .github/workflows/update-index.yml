name: Regenerate presentation index

on:
  push:
    branches: [master]
    paths-ignore:
      - 'index.html'   # avoid re-triggering on the commit this workflow creates

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate index.html
        run: python3 .github/scripts/build_index.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html topics.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: regenerate presentation index"
            git push
          fi
